function render(){state.history=Array.isArray(state.history)?state.history:[];state.score=Math.max(0,Math.min(100,state.score));el('score').textContent=state.score+'%';el('fill').style.width=state.score+'%';el('meter').setAttribute('aria-valuenow',state.score);el('choices').replaceChildren();const result=el('result');if(state.lastDelta!=null&&state.step>=0){const d=state.lastDelta;result.textContent=d>0?'지훈 호감도 +'+d+'점 획득!':d<0?'지훈 호감도 '+d+'점 감소':'지훈 호감도 변동 없음';result.className='result'+(d<0?' neg':'')}else{result.className='result hidden';result.textContent=''}if(state.step===-1){el('chapter').textContent='INTERACTIVE NOVEL · DOHUN SIDE';el('title').textContent='짝사랑은 교칙 위반인가요?';el('story').textContent='입학식 날, 나는 무대 위에서 노래를 불렀다.\n\n며칠 뒤에는 길을 잃은 신입생 하나를 댄스부 연습실까지 데려다줬다. 이름은 한지훈. 웃기고, 조금 이상하고, 내 앞에서만 자꾸 말을 더듬던 애.\n\n처음엔 그저 재미있는 후배인 줄 알았다. 그 애가 더는 나를 보며 웃지 않게 되기 전까지는.\n\n김도훈의 시점에서 시작하는 이야기. 당신의 말과 행동이 지훈의 마음을 바꿉니다.\n\n호감도 50%에서 시작합니다. 선택지에는 점수가 보이지 않습니다. 한 번의 말이 생각보다 오래 남을 수도 있어요.';addButton('이야기 시작하기','',()=>{state.step=0;save();render()});el('status').textContent='10개의 장면 · 매 장면 + / − / 0 선택지 · 총 4개의 엔딩';}else if(state.step<scenes.length){const s=scenes[state.step];el('chapter').textContent=`CHAPTER ${String(state.step+1).padStart(2,'0')} / ${scenes.length}`;el('title').textContent=s.title;el('story').textContent=(state.after?state.after+'\n\n──────\n\n':'')+(state.step>=3&&state.history[1]===2?'\n\n지훈은 그날 복도에서의 농담을 아직 기억하고 있었다. 웃어 넘긴 줄 알았는데 아니었다.\n\n': '')+(state.step>=6&&state.history[3]===2?'\n\n한동안 지훈의 답장은 짧았다. 기다리라는 내 말이 그 애에게는 무겁게 남았던 모양이다.\n\n':'')+s.story;s.choices.forEach(choice=>addButton(choice.label,'',()=>{state.lastDelta=choice.delta;state.after=choice.after;state.history[state.step]=s.choices.indexOf(choice);state.score=Math.max(0,Math.min(100,state.score+choice.delta));state.step++;save();render();window.scrollTo({top:0,behavior:'smooth'})}));el('status').textContent='선택 결과는 자동 저장됩니다.';}else{const finalChoice=state.history[scenes.length-1];
const ending=state.score===100&&finalChoice===0?endings.happy:
  state.score<25?endings.bad2:
  state.score<50?endings.bad1:endings.normal;el('chapter').textContent='THE END';el('title').textContent=ending.name;el('story').textContent=(state.after?state.after+'\n\n──────\n\n':'')+ending.body;addButton('다시 플레이하기','',reset);el('status').textContent='최종 호감도 '+state.score+'%';}}
function addButton(label,delta,fn){const b=document.createElement('button');b.className='choice';const t=document.createElement('span');t.textContent=label;b.append(t);if(delta){const d=document.createElement('span');d.className='delta'+(delta.startsWith('-')?' neg':'');d.textContent=delta+'점';b.append(d)}b.addEventListener('click',fn);el('choices').append(b)}function reset(){if(!confirm('진행 상황을 지우고 처음부터 시작할까요?'))return;state={step:-1,score:50,lastDelta:null,history:[]};save();render();window.scrollTo({top:0,behavior:'smooth'})}el('reset').addEventListener('click',reset);render();
</script>
</body></html>
